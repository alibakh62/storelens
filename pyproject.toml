[project]
name = "storelens"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn>=0.29", "duckdb>=1.0", "pandas>=2.2", "numpy>=1.26",
  "scikit-learn>=1.4", "scipy>=1.12", "sqlglot>=25", "pydantic>=2.6", "sse-starlette>=2.0",
  "joblib>=1.3", "pyyaml>=6", "jinja2>=3.1", "python-pptx>=0.6.23", "httpx>=0.27",
]
[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.40"]
dev = ["pytest>=8", "playwright>=1.40"]
[tool.uv]
package = false
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
