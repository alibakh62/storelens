  - {id: g10, persona: exec, question: "Did anything change here recently?", store: demo_store, must_cite: [S9.upcoming_change], must_contain: ["unlikely to be the cause"]}
  - {id: g11, persona: exec, question: "How much is the DFW outage costing us?", store: demo_store, must_cite: [S1.parent_incident], must_contain: ["est. lost sales", "every hour"]}
  - {id: g12, persona: engineer, question: "How much is the DFW outage costing us?", store: demo_store, must_cite: [S1.parent_incident], must_contain: ["restricted"], must_not_contain: ["\\$\\d"]}
