# Golden set (SPEC §8.9). Refs like "S1.parent_incident" / "demo_fuel_open" resolve via scenario_manifest.json.
# must_contain: case-insensitive substrings (refs allowed as {ref}); must_not_contain: regexes.
cases:
  - {id: g01, persona: engineer, question: "What's going on at this store?", store: demo_store, must_cite: [S1.parent_incident, demo_offline_open, demo_fuel_open], must_contain: ["part of major", "{S1.isp}"]}
  - {id: g02, persona: exec, question: "What's going on at this store?", store: demo_store, must_cite: [S1.parent_incident], must_contain: ["lost sales", "stakeholders"], must_not_contain: ["\\bS\\d{5}-[A-Z]+-\\d{2}\\b", "WAN1"]}
  - {id: g03, persona: manager, question: "What's going on at this store?", store: demo_store, must_cite: [S1.parent_incident], must_contain: ["cash-only signage"]}
  - {id: g04, persona: engineer, question: "Is this affecting other stores?", store: demo_store, must_cite: [S1.parent_incident], must_contain: ["{S1.isp}", "lift", "expected"]}
  - {id: g05, persona: exec, question: "Is this affecting other stores?", store: demo_store, must_cite: [S1.parent_incident], must_contain: ["internet provider", "cash only"]}
  - {id: g06, persona: manager, question: "Is this affecting other stores?", store: demo_store, must_cite: [S1.parent_incident], must_contain: ["district managers"]}
  - {id: g07, persona: engineer, question: "What fixed this last time?", store: demo_store, incident: demo_fuel_open, must_cite: [S8.problems.0], must_contain: ["replace the secure card reader", "{S9.chronic_ci}"]}
