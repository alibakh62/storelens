  - {id: g16, persona: manager, question: "What's going on at this store?", store: west_store, must_contain: ["outside your Texas scope"], must_cite: []}
  - {id: g17, persona: engineer, question: "What caused the register freezes after the POS update?", incident: S4_incident, must_cite: [S4.changes.0], must_contain: ["rate of not-yet-changed stores"]}
  - {id: g18, persona: engineer, question: "Did a change cause this?", incident: S5_incident, must_cite: [S5.change], must_contain: ["95% CI"]}
