clock: {mode: running}             # frozen | running
llm:
  provider: gateway                 # gateway | anthropic | azure_openai | openai | bedrock | databricks | replay | template
  fallback_chain: [replay, template]
  model: "7ai-azure-foundry-gpt-6.1-sol"                        # set to the approved model id (gateway: leave "" to use $GATEWAY_MODEL)
  temperature: 0
  reasoning_effort: ""             # e.g. "none" for gpt-6.1-sol (tools need it); "" = auto-detect from gateway errors
  timeout_s: 12
  max_tool_rounds: 6
  record_on_live: true             # live answers also written to replay cache
display_tz: America/Chicago
fictionalize_vendors: false
blast: {window_before_h: 3, window_after_h: 1, min_support: 0.6, min_lift: 1.5}
changes: {lookback_h: 72, lookahead_d: 7, post_window_d: 5}
chronic: {window_d: 90, min_repeats_90d: 3, min_repeats_365d: 5}
data_dir: data/raw
